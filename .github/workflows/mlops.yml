name: MLOps Pipeline

on:
  push:
    branches: [master, main]
    paths:
      - 'data/**.dvc'
      - 'src/**.py'
      - 'params.yaml'
      - '.github/workflows/**.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:

  # ---------------------------------------------------------------------------
  # JOB 1 - UNIT TEST
  # ---------------------------------------------------------------------------
  test:
    name: Unit Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install "setuptools<81"
          pip install -r requirements.txt

      - name: Run unit tests
        run: pytest tests/ -v


  # ---------------------------------------------------------------------------
  # JOB 2 - TRAIN (auth via Workload Identity Federation)
  # ---------------------------------------------------------------------------
  train:
    name: Train
    needs: test
    runs-on: ubuntu-latest
    outputs:
      accuracy: ${{ steps.read_metrics.outputs.accuracy }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install "setuptools<81"
          pip install -r requirements.txt

      - id: gcp_auth
        name: Authenticate to GCP via WIF
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Pull data with DVC
        run: dvc pull data/train_phase1.csv data/eval.csv

      - name: Train model
        env:
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
          MLFLOW_TRACKING_USERNAME: ${{ secrets.MLFLOW_TRACKING_USERNAME }}
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.MLFLOW_TRACKING_PASSWORD }}
        run: python src/train.py

      - name: Read metrics
        id: read_metrics
        run: |
          ACC=$(python -c "import json; d=json.load(open('outputs/metrics.json')); print(d['accuracy'])")
          echo "accuracy=$ACC" >> $GITHUB_OUTPUT
          echo "Training accuracy: $ACC"

      - name: Upload model + metrics to Cloud Storage
        env:
          CLOUD_BUCKET: ${{ secrets.CLOUD_BUCKET }}
        run: |
          python - <<'EOF'
          import os
          from google.cloud import storage

          bucket_name = os.environ["CLOUD_BUCKET"]
          client = storage.Client()
          bucket = client.bucket(bucket_name)
          for src, dst in [
              ("models/model.pkl", "models/latest/model.pkl"),
              ("outputs/metrics.json", "models/latest/metrics.json"),
          ]:
              bucket.blob(dst).upload_from_filename(src)
              print(f"Uploaded {src} -> gs://{bucket_name}/{dst}")
          EOF

      - name: Save artifacts (metrics + report)
        uses: actions/upload-artifact@v4
        with:
          name: training-outputs
          path: |
            outputs/metrics.json
            outputs/report.txt


  # ---------------------------------------------------------------------------
  # JOB 3 - EVAL GATE: accuracy >= 0.70 + Bonus 4 rollback check
  # ---------------------------------------------------------------------------
  eval:
    name: Eval
    needs: train
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install minimal deps
        run: pip install google-cloud-storage

      - id: gcp_auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Eval gate + rollback check (Bonus 4)
        env:
          NEW_ACC: ${{ needs.train.outputs.accuracy }}
          CLOUD_BUCKET: ${{ secrets.CLOUD_BUCKET }}
        run: |
          python - <<'EOF'
          import json, os, sys
          from google.cloud import storage

          new_acc = float(os.environ["NEW_ACC"])
          bucket_name = os.environ["CLOUD_BUCKET"]

          # Hard gate: accuracy phai >= 0.70
          if new_acc < 0.70:
              print(f"FAILED: accuracy {new_acc:.4f} < 0.70. Huy deploy.")
              sys.exit(1)

          # Bonus 4: so sanh voi model dang chay (neu co prev metrics tren GCS)
          client = storage.Client()
          bucket = client.bucket(bucket_name)
          blob = bucket.blob("models/current/metrics.json")
          if blob.exists():
              prev = json.loads(blob.download_as_text())
              prev_acc = float(prev["accuracy"])
              print(f"Comparing: new={new_acc:.4f} vs current_deployed={prev_acc:.4f}")
              if new_acc < prev_acc:
                  print(
                      f"FAILED ROLLBACK: new accuracy {new_acc:.4f} < "
                      f"current deployed {prev_acc:.4f}. Giu nguyen model cu."
                  )
                  sys.exit(1)
              print(f"PASSED rollback check (+{(new_acc-prev_acc)*100:.2f}%).")
          else:
              print("No previously-deployed metrics found (first deploy).")

          print(f"PASSED eval gate: accuracy {new_acc:.4f} >= 0.70.")

          # Promote model latest -> current (this is what's actually serving)
          for fname in ("model.pkl", "metrics.json"):
              src_blob = bucket.blob(f"models/latest/{fname}")
              dst_blob = bucket.blob(f"models/current/{fname}")
              dst_blob.rewrite(src_blob)
          print("Promoted models/latest/* -> models/current/*")
          EOF


  # ---------------------------------------------------------------------------
  # JOB 4 - DEPLOY via SSH
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy
    needs: eval
    runs-on: ubuntu-latest
    steps:
      - name: SSH deploy to VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            sudo systemctl restart mlops-serve
            sleep 5
            for i in 1 2 3 4 5; do
              if curl -sf http://localhost:8000/health; then
                echo "Health check passed."
                exit 0
              fi
              echo "Retry $i: server not ready, waiting..."
              sleep 3
            done
            echo "Health check failed after retries."
            exit 1
